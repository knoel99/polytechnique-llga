<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-labelledby="t d">
  <title id="t">Graphe et LLM</title>
  <desc id="d">Nœuds de graphe reliés à une séquence de jetons, motif Graph×LLM.</desc>
  <style>
    .stroke { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: .55; }
    .node { fill: currentColor; opacity: .72; }
    .token { fill: none; stroke: currentColor; stroke-width: 1.4; opacity: .65; }
    .soft { fill: currentColor; opacity: .18; }
  </style>
  <!-- soft backdrop -->
  <circle class="soft" cx="110" cy="80" r="54"/>
  <rect class="soft" x="280" y="36" width="160" height="88" rx="10"/>
  <!-- graph edges -->
  <path class="stroke" d="M48 110 L90 58 L140 92 L90 58 L150 40"/>
  <path class="stroke" d="M140 92 L190 70"/>
  <path class="stroke" d="M140 92 L168 128"/>
  <!-- bridge -->
  <path class="stroke" d="M190 70 C230 70, 250 80, 280 80" stroke-dasharray="4 3"/>
  <!-- graph nodes -->
  <circle class="node" cx="48" cy="110" r="5.5"/>
  <circle class="node" cx="90" cy="58" r="6.5"/>
  <circle class="node" cx="140" cy="92" r="6"/>
  <circle class="node" cx="150" cy="40" r="5"/>
  <circle class="node" cx="168" cy="128" r="4.5"/>
  <circle class="node" cx="190" cy="70" r="5.5"/>
  <!-- LLM tokens -->
  <rect class="token" x="292" y="56" width="28" height="48" rx="5"/>
  <rect class="token" x="328" y="56" width="28" height="48" rx="5"/>
  <rect class="token" x="364" y="56" width="28" height="48" rx="5"/>
  <rect class="token" x="400" y="56" width="28" height="48" rx="5"/>
  <circle class="node" cx="306" cy="80" r="2.5"/>
  <circle class="node" cx="342" cy="80" r="2.5"/>
  <circle class="node" cx="378" cy="80" r="2.5"/>
  <circle class="node" cx="414" cy="80" r="2.5"/>
</svg>
