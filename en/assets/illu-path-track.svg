<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 72" role="img" aria-labelledby="t d">
  <title id="t">Parcours du track</title>
  <desc id="d">Six étapes M1-P1 à suite, reliées en ligne.</desc>
  <style>
    .line { fill: none; stroke: currentColor; stroke-width: 1.6; opacity: .4; }
    .dot { fill: currentColor; opacity: .75; }
    .lab { fill: currentColor; font-family: system-ui, sans-serif; font-size: 11px; opacity: .7; }
  </style>
  <path class="line" d="M40 36 H520"/>
  <circle class="dot" cx="40" cy="36" r="5"/>
  <circle class="dot" cx="136" cy="36" r="5"/>
  <circle class="dot" cx="232" cy="36" r="5"/>
  <circle class="dot" cx="328" cy="36" r="5"/>
  <circle class="dot" cx="424" cy="36" r="5"/>
  <circle class="dot" cx="520" cy="36" r="5"/>
  <text class="lab" x="40" y="58" text-anchor="middle">M1·P1</text>
  <text class="lab" x="136" y="58" text-anchor="middle">M1·P2</text>
  <text class="lab" x="232" y="58" text-anchor="middle">M1·P3</text>
  <text class="lab" x="328" y="58" text-anchor="middle">M2·P1</text>
  <text class="lab" x="424" y="58" text-anchor="middle">M2·P2</text>
  <text class="lab" x="520" y="58" text-anchor="middle">Suite</text>
</svg>
