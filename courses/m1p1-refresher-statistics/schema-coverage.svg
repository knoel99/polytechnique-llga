<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-labelledby="t d">
  <title id="t">Confidence interval coverage across samples</title>
  <desc id="d">Twenty confidence intervals computed from twenty samples; about nineteen contain the fixed parameter theta, one or two miss it.</desc>
  <style>
    .ci { stroke: #111; stroke-width: 2; }
    .miss { stroke: #111; stroke-width: 2; stroke-dasharray: 5,3; }
    .ax { stroke: #111; stroke-width: 1.4; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  </style>
  <text class="ttl" x="330" y="20" text-anchor="middle">20 samples → 20 intervals of level 95%</text>
  <line class="ax" x1="330" y1="30" x2="330" y2="185" stroke-dasharray="3,3"/>
  <text class="lab" x="330" y="200" text-anchor="middle">θ (fixed)</text>
  <line class="ci" x1="180" y1="38"  x2="360" y2="38"/>
  <line class="ci" x1="290" y1="46"  x2="450" y2="46"/>
  <line class="ci" x1="240" y1="54"  x2="420" y2="54"/>
  <line class="ci" x1="310" y1="62"  x2="500" y2="62"/>
  <line class="ci" x1="200" y1="70"  x2="390" y2="70"/>
  <line class="miss" x1="360" y1="78" x2="520" y2="78"/>
  <line class="ci" x1="260" y1="86"  x2="440" y2="86"/>
  <line class="ci" x1="300" y1="94"  x2="470" y2="94"/>
  <line class="ci" x1="220" y1="102" x2="400" y2="102"/>
  <line class="ci" x1="280" y1="110" x2="430" y2="110"/>
  <line class="ci" x1="330" y1="118" x2="510" y2="118"/>
  <line class="ci" x1="190" y1="126" x2="370" y2="126"/>
  <line class="ci" x1="270" y1="134" x2="450" y2="134"/>
  <line class="miss" x1="160" y1="142" x2="310" y2="142"/>
  <line class="ci" x1="240" y1="150" x2="420" y2="150"/>
  <line class="ci" x1="310" y1="158" x2="480" y2="158"/>
  <line class="ci" x1="210" y1="166" x2="410" y2="166"/>
  <line class="ci" x1="290" y1="174" x2="460" y2="174"/>
  <line class="ci" x1="250" y1="182" x2="440" y2="182"/>
  <text class="lab" x="560" y="82">misses</text>
  <text class="lab" x="128" y="146">misses</text>
  <text class="lab" x="330" y="222" text-anchor="middle">Coverage is a property of the procedure across samples — 18/20 here, → 95% on average.</text>
</svg>
