<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t d">
  <title id="t">Law of large numbers, sample paths</title>
  <desc id="d">Running sample means converge toward mu inside a shrinking plus-or-minus two sigma over root n funnel.</desc>
  <style>
    .c { stroke: #111; stroke-width: 1.5; fill: none; }
    .fun { stroke: #111; stroke-width: 1.2; fill: none; stroke-dasharray: 4,3; }
    .ax { stroke: #111; stroke-width: 1.2; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .sh { fill: #111; opacity: 0.07; }
  </style>
  <text class="ttl" x="320" y="20" text-anchor="middle">X̄ₙ over sample size n (three iid runs)</text>
  <path class="sh" d="M40 30 C140 55, 240 72, 600 100 L600 120 C240 128, 140 165, 40 190 Z"/>
  <line class="ax" x1="40" y1="110" x2="600" y2="110" stroke-dasharray="2,3"/>
  <text class="lab" x="46" y="104">μ</text>
  <path class="fun" d="M40 30 C140 55, 240 72, 600 100"/>
  <path class="fun" d="M40 190 C140 165, 240 128, 600 120"/>
  <text class="lab" x="500" y="80">+2σ/√n</text>
  <text class="lab" x="500" y="145">−2σ/√n</text>
  <path class="c" d="M40 58 L70 44 L100 66 L130 92 L160 84 L200 98 L240 88 L290 104 L340 96 L400 108 L470 102 L540 110 L600 107"/>
  <path class="c" d="M40 168 L70 150 L100 158 L130 141 L160 152 L200 143 L240 128 L290 134 L340 124 L400 118 L470 114 L540 112 L600 111"/>
  <path class="c" d="M40 130 L70 116 L100 124 L130 108 L160 118 L200 128 L240 116 L290 122 L340 114 L400 119 L470 113 L540 109 L600 110"/>
  <line class="ax" x1="40" y1="200" x2="600" y2="200"/>
  <text class="lab" x="40" y="215">n=1</text>
  <text class="lab" x="580" y="215">n large</text>
</svg>
