<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" role="img" aria-labelledby="t d">
  <title id="t">Confidence interval via pivot</title>
  <desc id="d">Standard normal pivot with critical values plus or minus z alpha/2 mapping to CI for mu.</desc>
  <style>
    .c { stroke: #111; stroke-width: 1.8; fill: none; }
    .ax { stroke: #111; stroke-width: 1.2; }
    .sh { fill: #111; opacity: 0.12; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  </style>
  <text class="ttl" x="310" y="20" text-anchor="middle">Pivot Z = √n (X̄−μ)/σ ~ N(0,1)</text>
  <line class="ax" x1="40" y1="140" x2="400" y2="140"/>
  <path class="c" d="M50 135 C100 130, 140 50, 220 40 C300 50, 340 130, 390 135"/>
  <path class="sh" d="M50 135 C80 132, 100 110, 120 95 L120 140 Z"/>
  <path class="sh" d="M320 95 C340 110, 360 132, 390 135 L390 140 L320 140 Z"/>
  <line class="ax" x1="120" y1="50" x2="120" y2="140" stroke-dasharray="3,2"/>
  <line class="ax" x1="320" y1="50" x2="320" y2="140" stroke-dasharray="3,2"/>
  <text class="lab" x="120" y="155" text-anchor="middle">−z_{α/2}</text>
  <text class="lab" x="320" y="155" text-anchor="middle">+z_{α/2}</text>
  <text class="lab" x="220" y="70" text-anchor="middle">1−α mass</text>
  <text class="lab" x="510" y="70" text-anchor="middle">⇔</text>
  <text class="lab" x="510" y="95" text-anchor="middle">X̄ ± z_{α/2} σ/√n</text>
  <text class="lab" x="510" y="115" text-anchor="middle">covers μ with</text>
  <text class="lab" x="510" y="133" text-anchor="middle">prob ≈ 1−α</text>
</svg>
