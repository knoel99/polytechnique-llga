<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-labelledby="t d">
  <title id="t">Gaussian conditioning</title>
  <desc id="d">Left: elliptical contours of a correlated Gaussian pair with a vertical slice at X=x0. Right: marginal density of Y versus the narrower conditional density of Y given X=x0.</desc>
  <style>
    .c { stroke: #111; stroke-width: 1.8; fill: none; }
    .e { stroke: #111; stroke-width: 1.3; fill: none; }
    .ax { stroke: #111; stroke-width: 1.2; }
    .sh { fill: #111; opacity: 0.12; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .pt { fill: #111; }
  </style>
  <text class="ttl" x="160" y="20" text-anchor="middle">Joint contours (ρ &gt; 0)</text>
  <ellipse class="e" cx="160" cy="130" rx="105" ry="48" transform="rotate(-14 160 130)"/>
  <ellipse class="e" cx="160" cy="130" rx="65"  ry="30" transform="rotate(-14 160 130)"/>
  <circle class="pt" cx="160" cy="130" r="3"/>
  <line class="ax" x1="40" y1="185" x2="300" y2="185"/>
  <line class="ax" x1="45" y1="40" x2="45" y2="190"/>
  <text class="lab" x="308" y="189">X</text>
  <text class="lab" x="38" y="36">Y</text>
  <line class="ax" x1="215" y1="45" x2="215" y2="185" stroke-dasharray="3,2"/>
  <text class="lab" x="215" y="200" text-anchor="middle">x₀</text>
  <circle class="pt" cx="215" cy="112" r="3"/>
  <text class="lab" x="228" y="106">E[Y|X=x₀]</text>

  <text class="ttl" x="480" y="20" text-anchor="middle">Density of Y</text>
  <line class="ax" x1="360" y1="185" x2="630" y2="185"/>
  <line class="ax" x1="365" y1="40" x2="365" y2="190"/>
  <path class="e" d="M380 182 C420 176, 440 128, 480 122 C520 128, 545 172, 600 181"/>
  <path class="c" d="M425 182 C445 178, 455 88, 482 85 C508 88, 520 176, 540 182"/>
  <line class="ax" x1="482" y1="85" x2="482" y2="185" stroke-dasharray="3,2"/>
  <text class="lab" x="482" y="200" text-anchor="middle">shifted mean</text>
  <text class="lab" x="392" y="140">marginal</text>
  <text class="lab" x="530" y="120">conditional</text>
  <text class="lab" x="330" y="222" text-anchor="middle">Y | X=x₀ ~ N(affine mean in x₀, reduced variance) — theorem 3.2</text>
</svg>
