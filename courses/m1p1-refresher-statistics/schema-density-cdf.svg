<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t d">
  <title id="t">Density and CDF</title>
  <desc id="d">Left: N(0,1) density with shaded P(X less than a). Right: CDF rising to F(a).</desc>
  <style>
    .ax { stroke: #111; stroke-width: 1.2; fill: none; }
    .c { stroke: #111; stroke-width: 1.8; fill: none; }
    .sh { fill: #111; opacity: 0.18; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  </style>
  <text class="ttl" x="150" y="20" text-anchor="middle">Density f</text>
  <line class="ax" x1="40" y1="180" x2="280" y2="180"/>
  <line class="ax" x1="160" y1="40" x2="160" y2="180"/>
  <path class="c" d="M50 170 C90 165, 110 80, 160 55 C210 80, 230 165, 270 170"/>
  <path class="sh" d="M50 170 C90 165, 110 80, 160 55 L160 180 L50 180 Z"/>
  <text class="lab" x="130" y="195">a</text>
  <text class="lab" x="95" y="140">P(X≤a)</text>
  <text class="ttl" x="470" y="20" text-anchor="middle">CDF F</text>
  <line class="ax" x1="360" y1="180" x2="600" y2="180"/>
  <line class="ax" x1="360" y1="40" x2="360" y2="180"/>
  <path class="c" d="M370 175 C420 170, 450 140, 480 110 C510 80, 540 50, 590 45"/>
  <line class="ax" x1="480" y1="110" x2="480" y2="180" stroke-dasharray="3,3"/>
  <line class="ax" x1="360" y1="110" x2="480" y2="110" stroke-dasharray="3,3"/>
  <text class="lab" x="480" y="195" text-anchor="middle">a</text>
  <text class="lab" x="340" y="114" text-anchor="end">F(a)</text>
</svg>
