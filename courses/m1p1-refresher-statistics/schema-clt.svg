<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" role="img" aria-labelledby="t d">
  <title id="t">CLT histogram to Gaussian</title>
  <desc id="d">Uniform samples average; histogram of means becomes bell-shaped.</desc>
  <style>
    .bar { fill: #111; opacity: 0.35; }
    .c { stroke: #111; stroke-width: 1.8; fill: none; }
    .ax { stroke: #111; stroke-width: 1.2; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .arr { stroke: #111; stroke-width: 1.5; fill: none; marker-end: url(#m); }
  </style>
  <defs><marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 Z" fill="#111"/></marker></defs>
  <text class="ttl" x="110" y="22" text-anchor="middle">Xᵢ ~ U(0,1)</text>
  <rect class="bar" x="40" y="50" width="140" height="100"/>
  <line class="ax" x1="40" y1="150" x2="180" y2="150"/>
  <text class="lab" x="110" y="170" text-anchor="middle">flat density</text>
  <path class="arr" d="M200 100 H260"/>
  <text class="lab" x="230" y="90" text-anchor="middle">X̄ₙ</text>
  <text class="ttl" x="420" y="22" text-anchor="middle">Histogram of X̄ₙ (n=30)</text>
  <rect class="bar" x="300" y="120" width="18" height="30"/>
  <rect class="bar" x="320" y="100" width="18" height="50"/>
  <rect class="bar" x="340" y="70" width="18" height="80"/>
  <rect class="bar" x="360" y="50" width="18" height="100"/>
  <rect class="bar" x="380" y="40" width="18" height="110"/>
  <rect class="bar" x="400" y="45" width="18" height="105"/>
  <rect class="bar" x="420" y="55" width="18" height="95"/>
  <rect class="bar" x="440" y="75" width="18" height="75"/>
  <rect class="bar" x="460" y="105" width="18" height="45"/>
  <rect class="bar" x="480" y="125" width="18" height="25"/>
  <line class="ax" x1="290" y1="150" x2="520" y2="150"/>
  <path class="c" d="M300 145 C340 140, 360 50, 390 40 C420 50, 450 120, 500 145"/>
  <text class="lab" x="600" y="90" text-anchor="middle">≈ N(μ, σ²/n)</text>
  <text class="lab" x="600" y="110" text-anchor="middle">μ=1/2</text>
  <text class="lab" x="600" y="128" text-anchor="middle">σ=1/√12</text>
</svg>
