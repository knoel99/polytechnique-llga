<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 235" role="img" aria-labelledby="t d">
  <title id="t">Missingness mechanisms MCAR MAR MNAR</title>
  <desc id="d">Three data grids: holes scattered at random; holes in column X2 driven by observed high X1 values; holes in X2 driven by the unobserved X2 values themselves.</desc>
  <style>
    .cell { fill: none; stroke: #111; stroke-width: 1; }
    .full { fill: #111; opacity: 0.12; stroke: #111; stroke-width: 1; }
    .drv { fill: #111; opacity: 0.45; stroke: #111; stroke-width: 1; }
    .mis { fill: none; stroke: #111; stroke-width: 1.2; }
    .x { stroke: #111; stroke-width: 1.2; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  </style>
  <text class="ttl" x="115" y="18" text-anchor="middle">MCAR</text>
  <g transform="translate(35,30)">
    <rect class="mis" x="96" y="18" width="18" height="18"/><line class="x" x1="96" y1="18" x2="114" y2="36"/><line class="x" x1="114" y1="18" x2="96" y2="36"/>
    <rect class="mis" x="42" y="54" width="18" height="18"/><line class="x" x1="42" y1="54" x2="60" y2="72"/><line class="x" x1="60" y1="54" x2="42" y2="72"/>
    <rect class="mis" x="132" y="72" width="18" height="18"/><line class="x" x1="132" y1="72" x2="150" y2="90"/><line class="x" x1="150" y1="72" x2="132" y2="90"/>
    <rect class="full" x="6" y="18" width="18" height="18"/><rect class="full" x="24" y="18" width="18" height="18"/><rect class="full" x="42" y="18" width="18" height="18"/><rect class="full" x="60" y="18" width="18" height="18"/><rect class="full" x="78" y="18" width="18" height="18"/><rect class="full" x="114" y="18" width="18" height="18"/><rect class="full" x="132" y="18" width="18" height="18"/><rect class="full" x="150" y="18" width="18" height="18"/>
    <rect class="full" x="6" y="36" width="18" height="18"/><rect class="full" x="24" y="36" width="18" height="18"/><rect class="full" x="42" y="36" width="18" height="18"/><rect class="full" x="60" y="36" width="18" height="18"/><rect class="full" x="78" y="36" width="18" height="18"/><rect class="full" x="96" y="36" width="18" height="18"/><rect class="full" x="114" y="36" width="18" height="18"/><rect class="full" x="132" y="36" width="18" height="18"/><rect class="full" x="150" y="36" width="18" height="18"/>
    <rect class="full" x="6" y="54" width="18" height="18"/><rect class="full" x="24" y="54" width="18" height="18"/><rect class="full" x="60" y="54" width="18" height="18"/><rect class="full" x="78" y="54" width="18" height="18"/><rect class="full" x="96" y="54" width="18" height="18"/><rect class="full" x="114" y="54" width="18" height="18"/><rect class="full" x="132" y="54" width="18" height="18"/><rect class="full" x="150" y="54" width="18" height="18"/>
    <rect class="full" x="6" y="72" width="18" height="18"/><rect class="full" x="24" y="72" width="18" height="18"/><rect class="full" x="42" y="72" width="18" height="18"/><rect class="full" x="60" y="72" width="18" height="18"/><rect class="full" x="78" y="72" width="18" height="18"/><rect class="full" x="96" y="72" width="18" height="18"/><rect class="full" x="114" y="72" width="18" height="18"/><rect class="full" x="150" y="72" width="18" height="18"/>
  </g>
  <text class="lab" x="115" y="145" text-anchor="middle">holes independent of all values;</text>
  <text class="lab" x="115" y="161" text-anchor="middle">complete cases stay representative</text>

  <text class="ttl" x="340" y="18" text-anchor="middle">MAR</text>
  <g transform="translate(260,30)">
    <rect class="full" x="6" y="18" width="18" height="18"/><rect class="full" x="24" y="18" width="18" height="18"/><rect class="full" x="42" y="18" width="18" height="18"/><rect class="full" x="60" y="18" width="18" height="18"/><rect class="full" x="78" y="18" width="18" height="18"/><rect class="full" x="96" y="18" width="18" height="18"/><rect class="full" x="114" y="18" width="18" height="18"/><rect class="full" x="132" y="18" width="18" height="18"/><rect class="full" x="150" y="18" width="18" height="18"/>
    <rect class="full" x="6" y="36" width="18" height="18"/><rect class="full" x="24" y="36" width="18" height="18"/><rect class="full" x="42" y="36" width="18" height="18"/><rect class="full" x="60" y="36" width="18" height="18"/><rect class="full" x="78" y="36" width="18" height="18"/><rect class="full" x="96" y="36" width="18" height="18"/><rect class="full" x="114" y="36" width="18" height="18"/><rect class="full" x="132" y="36" width="18" height="18"/><rect class="full" x="150" y="36" width="18" height="18"/>
    <rect class="full" x="6" y="54" width="18" height="18"/><rect class="full" x="24" y="54" width="18" height="18"/><rect class="full" x="42" y="54" width="18" height="18"/><rect class="full" x="60" y="54" width="18" height="18"/><rect class="full" x="78" y="54" width="18" height="18"/><rect class="full" x="96" y="54" width="18" height="18"/><rect class="full" x="114" y="54" width="18" height="18"/><rect class="full" x="132" y="54" width="18" height="18"/><rect class="full" x="150" y="54" width="18" height="18"/>
    <rect class="drv" x="6" y="72" width="18" height="18"/><rect class="drv" x="24" y="72" width="18" height="18"/><rect class="drv" x="42" y="72" width="18" height="18"/><rect class="full" x="60" y="72" width="18" height="18"/><rect class="full" x="78" y="72" width="18" height="18"/><rect class="full" x="96" y="72" width="18" height="18"/>
    <rect class="mis" x="114" y="72" width="18" height="18"/><line class="x" x1="114" y1="72" x2="132" y2="90"/><line class="x" x1="132" y1="72" x2="114" y2="90"/>
    <rect class="mis" x="132" y="72" width="18" height="18"/><line class="x" x1="132" y1="72" x2="150" y2="90"/><line class="x" x1="150" y1="72" x2="132" y2="90"/>
    <rect class="full" x="150" y="72" width="18" height="18"/>
  </g>
  <text class="lab" x="340" y="145" text-anchor="middle">X₂ missing when observed X₁ is large;</text>
  <text class="lab" x="340" y="161" text-anchor="middle">X₁ can explain the selection</text>

  <text class="ttl" x="565" y="18" text-anchor="middle">MNAR</text>
  <g transform="translate(485,30)">
    <rect class="full" x="6" y="18" width="18" height="18"/><rect class="full" x="24" y="18" width="18" height="18"/><rect class="full" x="42" y="18" width="18" height="18"/><rect class="full" x="60" y="18" width="18" height="18"/><rect class="full" x="78" y="18" width="18" height="18"/><rect class="full" x="96" y="18" width="18" height="18"/><rect class="full" x="114" y="18" width="18" height="18"/><rect class="full" x="132" y="18" width="18" height="18"/><rect class="full" x="150" y="18" width="18" height="18"/>
    <rect class="full" x="6" y="36" width="18" height="18"/><rect class="full" x="24" y="36" width="18" height="18"/><rect class="full" x="42" y="36" width="18" height="18"/><rect class="full" x="60" y="36" width="18" height="18"/><rect class="full" x="78" y="36" width="18" height="18"/><rect class="full" x="96" y="36" width="18" height="18"/><rect class="full" x="114" y="36" width="18" height="18"/><rect class="full" x="132" y="36" width="18" height="18"/><rect class="full" x="150" y="36" width="18" height="18"/>
    <rect class="full" x="6" y="54" width="18" height="18"/><rect class="full" x="24" y="54" width="18" height="18"/><rect class="full" x="42" y="54" width="18" height="18"/><rect class="full" x="60" y="54" width="18" height="18"/><rect class="full" x="78" y="54" width="18" height="18"/><rect class="full" x="96" y="54" width="18" height="18"/><rect class="mis" x="114" y="54" width="18" height="18"/><line class="x" x1="114" y1="54" x2="132" y2="72"/><line class="x" x1="132" y1="54" x2="114" y2="72"/><rect class="full" x="132" y="54" width="18" height="18"/><rect class="full" x="150" y="54" width="18" height="18"/>
    <rect class="full" x="6" y="72" width="18" height="18"/><rect class="full" x="24" y="72" width="18" height="18"/><rect class="full" x="42" y="72" width="18" height="18"/><rect class="full" x="60" y="72" width="18" height="18"/><rect class="full" x="78" y="72" width="18" height="18"/><rect class="full" x="96" y="72" width="18" height="18"/><rect class="mis" x="114" y="72" width="18" height="18"/><line class="x" x1="114" y1="72" x2="132" y2="90"/><line class="x" x1="132" y1="72" x2="114" y2="90"/><rect class="full" x="132" y="72" width="18" height="18"/><rect class="full" x="150" y="72" width="18" height="18"/>
  </g>
  <text class="lab" x="565" y="145" text-anchor="middle">X₂ missing when X₂ itself is large;</text>
  <text class="lab" x="565" y="161" text-anchor="middle">the driver is never observed</text>

  <text class="lab" x="340" y="195" text-anchor="middle">dark cells: observed values that drive missingness · crossed cells: missing entries</text>
  <text class="lab" x="340" y="215" text-anchor="middle">Observed data alone cannot distinguish MAR from MNAR — sensitivity analysis needed</text>
</svg>
