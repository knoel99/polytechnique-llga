<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-labelledby="t d">
  <title id="t">Simpson's paradox</title>
  <desc id="d">Grouped bar chart: protocol A beats B in mild and severe subgroups, B wins overall because it treats mostly mild cases.</desc>
  <style>
    .a { fill: #111; opacity: 0.35; }
    .b { fill: none; stroke: #111; stroke-width: 1.5; }
    .ax { stroke: #111; stroke-width: 1.2; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  </style>
  <text class="ttl" x="320" y="20" text-anchor="middle">Cure rate by protocol (same data as example 1.11)</text>
  <line class="ax" x1="40" y1="190" x2="620" y2="190"/>
  <rect class="a" x="70"  y="47"  width="56" height="143"/>
  <rect class="b" x="140" y="49"  width="56" height="141"/>
  <text class="lab" x="98"  y="40" text-anchor="middle">95%</text>
  <text class="lab" x="168" y="42" text-anchor="middle">94%</text>
  <text class="ttl" x="133" y="215" text-anchor="middle">Mild</text>
  <rect class="a" x="280" y="130" width="56" height="60"/>
  <rect class="b" x="350" y="166" width="56" height="24"/>
  <text class="lab" x="308" y="123" text-anchor="middle">40%</text>
  <text class="lab" x="378" y="159" text-anchor="middle">16%</text>
  <text class="ttl" x="343" y="215" text-anchor="middle">Severe</text>
  <rect class="a" x="490" y="103" width="56" height="87"/>
  <rect class="b" x="560" y="59"  width="56" height="131"/>
  <text class="lab" x="518" y="96"  text-anchor="middle">58%</text>
  <text class="lab" x="588" y="52"  text-anchor="middle">87%</text>
  <text class="ttl" x="553" y="215" text-anchor="middle">Overall</text>
  <rect class="a" x="70" y="228" width="20" height="10"/>
  <text class="lab" x="96" y="237">protocol A</text>
  <rect class="b" x="170" y="228" width="20" height="10"/>
  <text class="lab" x="196" y="237">protocol B</text>
  <text class="lab" x="420" y="237">A wins within each subgroup,</text>
  <text class="ttl" x="320" y="258" text-anchor="middle">B wins overall: severity is a confounder</text>
</svg>
