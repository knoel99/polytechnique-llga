<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 265" role="img" aria-labelledby="t d">
  <title id="t">Shapes of common distributions</title>
  <desc id="d">Six mini panels: Bernoulli bars, Poisson bars, uniform flat density, decaying exponential, Gaussian bell, right-skewed chi-square.</desc>
  <style>
    .bar { fill: #111; opacity: 0.35; }
    .c { stroke: #111; stroke-width: 1.8; fill: none; }
    .ax { stroke: #111; stroke-width: 1.2; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
  </style>
  <text class="ttl" x="110" y="16" text-anchor="middle">Bernoulli(p)</text>
  <rect class="bar" x="60" y="52" width="26" height="38"/>
  <rect class="bar" x="120" y="24" width="26" height="66"/>
  <line class="ax" x1="40" y1="90" x2="190" y2="90"/>
  <text class="lab" x="73" y="102" text-anchor="middle">0</text>
  <text class="lab" x="133" y="102" text-anchor="middle">1</text>

  <text class="ttl" x="340" y="16" text-anchor="middle">Poisson(λ)</text>
  <rect class="bar" x="272" y="66" width="16" height="24"/>
  <rect class="bar" x="296" y="46" width="16" height="44"/>
  <rect class="bar" x="320" y="30" width="16" height="60"/>
  <rect class="bar" x="344" y="38" width="16" height="52"/>
  <rect class="bar" x="368" y="56" width="16" height="34"/>
  <rect class="bar" x="392" y="72" width="16" height="18"/>
  <line class="ax" x1="260" y1="90" x2="420" y2="90"/>
  <text class="lab" x="340" y="102" text-anchor="middle">counts: λ = Var</text>

  <text class="ttl" x="570" y="16" text-anchor="middle">Uniform[a,b]</text>
  <path class="c" d="M490 55 H630"/>
  <line class="ax" x1="480" y1="90" x2="650" y2="90"/>
  <text class="lab" x="492" y="102" text-anchor="middle">a</text>
  <text class="lab" x="628" y="102" text-anchor="middle">b</text>

  <text class="ttl" x="110" y="130" text-anchor="middle">Exponential(λ)</text>
  <path class="c" d="M50 145 C70 190, 110 200, 180 203"/>
  <line class="ax" x1="40" y1="204" x2="190" y2="204"/>
  <text class="lab" x="110" y="218" text-anchor="middle">waiting times · memoryless</text>

  <text class="ttl" x="340" y="130" text-anchor="middle">Gaussian N(μ, σ²)</text>
  <path class="c" d="M265 200 C295 198, 310 148, 340 144 C370 148, 385 198, 415 200"/>
  <line class="ax" x1="260" y1="204" x2="420" y2="204"/>
  <text class="lab" x="340" y="218" text-anchor="middle">noise model · CLT limit</text>

  <text class="ttl" x="570" y="130" text-anchor="middle">Chi-square(k)</text>
  <path class="c" d="M490 203 C520 200, 525 150, 555 160 C585 172, 600 196, 640 202"/>
  <line class="ax" x1="480" y1="204" x2="650" y2="204"/>
  <text class="lab" x="570" y="218" text-anchor="middle">squared deviations · tests</text>

  <text class="lab" x="340" y="245" text-anchor="middle">Support, parameters, E, Var and the scenario where each appears: see the table below.</text>
</svg>
