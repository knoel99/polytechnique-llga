<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="t d">
  <title id="t">Least squares as orthogonal projection</title>
  <desc id="d">Point y projected orthogonally onto the column space of X; the residual is perpendicular to the plane and shorter than any other candidate X beta.</desc>
  <style>
    .pl { fill: #111; opacity: 0.08; stroke: #111; stroke-width: 1.3; }
    .c { stroke: #111; stroke-width: 1.8; fill: none; }
    .dash { stroke: #111; stroke-width: 1.2; fill: none; stroke-dasharray: 4,3; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .pt { fill: #111; }
    .ra { stroke: #111; stroke-width: 1; fill: none; }
  </style>
  <text class="ttl" x="230" y="20" text-anchor="middle">Geometry of least squares</text>
  <polygon class="pl" points="70,185 260,140 370,190 180,235"/>
  <text class="lab" x="215" y="215" text-anchor="middle">Im(X) — span of the columns</text>
  <circle class="pt" cx="255" cy="55" r="3.5"/>
  <text class="lab" x="255" y="45" text-anchor="middle">y</text>
  <circle class="pt" cx="230" cy="172" r="3.5"/>
  <text class="lab" x="230" y="192" text-anchor="middle">ŷ = Xβ̂</text>
  <line class="c" x1="255" y1="55" x2="230" y2="172"/>
  <path class="ra" d="M255 155 h-15 v17"/>
  <text class="lab" x="272" y="120">residual r = y−ŷ ⟂ Im(X)</text>
  <path class="dash" d="M255 55 L140 165"/>
  <circle class="pt" cx="140" cy="165" r="2.5"/>
  <text class="lab" x="118" y="152" text-anchor="middle">Xβ</text>
  <text class="lab" x="120" y="92">‖y−Xβ‖ ≥ ‖r‖</text>
  <text class="ttl" x="495" y="90" text-anchor="middle">Xᵀ(y − Xβ̂) = 0</text>
  <text class="lab" x="495" y="115" text-anchor="middle">normal equations;</text>
  <text class="lab" x="495" y="133" text-anchor="middle">β̂ = (XᵀX)⁻¹Xᵀy when</text>
  <text class="lab" x="495" y="151" text-anchor="middle">the columns are independent</text>
</svg>
