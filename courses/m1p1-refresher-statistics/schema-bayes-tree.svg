<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d">
  <title id="t">Bayes medical test tree</title>
  <desc id="d">Prior disease branches into positive and negative test outcomes with joint probabilities.</desc>
  <style>
    .n { fill: #fff; stroke: #111; stroke-width: 1.3; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .em { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    .e { stroke: #111; stroke-width: 1.3; fill: none; }
  </style>
  <rect class="n" x="270" y="10" width="100" height="36" rx="4"/>
  <text class="lab" x="320" y="32" text-anchor="middle">Population</text>
  <path class="e" d="M300 46 L180 90"/><path class="e" d="M340 46 L460 90"/>
  <text class="lab" x="220" y="72">P(M)=0.01</text>
  <text class="lab" x="420" y="72">P(Mᶜ)=0.99</text>
  <rect class="n" x="120" y="90" width="120" height="36" rx="4"/>
  <text class="lab" x="180" y="112" text-anchor="middle">Sick (M)</text>
  <rect class="n" x="400" y="90" width="120" height="36" rx="4"/>
  <text class="lab" x="460" y="112" text-anchor="middle">Healthy (Mᶜ)</text>
  <path class="e" d="M150 126 L90 170"/><path class="e" d="M210 126 L270 170"/>
  <path class="e" d="M430 126 L370 170"/><path class="e" d="M490 126 L550 170"/>
  <text class="lab" x="95" y="155">0.99</text><text class="lab" x="250" y="155">0.01</text>
  <text class="lab" x="375" y="155">0.05</text><text class="lab" x="530" y="155">0.95</text>
  <rect class="n" x="40" y="170" width="100" height="50" rx="4"/>
  <text class="em" x="90" y="190" text-anchor="middle">TP: + ∩ M</text>
  <text class="lab" x="90" y="208" text-anchor="middle">0.0099</text>
  <rect class="n" x="220" y="170" width="100" height="50" rx="4"/>
  <text class="lab" x="270" y="190" text-anchor="middle">FN: − ∩ M</text>
  <text class="lab" x="270" y="208" text-anchor="middle">0.0001</text>
  <rect class="n" x="340" y="170" width="100" height="50" rx="4"/>
  <text class="em" x="390" y="190" text-anchor="middle">FP: + ∩ Mᶜ</text>
  <text class="lab" x="390" y="208" text-anchor="middle">0.0495</text>
  <rect class="n" x="500" y="170" width="100" height="50" rx="4"/>
  <text class="lab" x="550" y="190" text-anchor="middle">TN: − ∩ Mᶜ</text>
  <text class="lab" x="550" y="208" text-anchor="middle">0.9405</text>
  <text class="em" x="320" y="245" text-anchor="middle">P(M|+)=0.0099/(0.0099+0.0495)≈0.167</text>
</svg>
