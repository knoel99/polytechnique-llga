<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="t d">
  <title id="t">Bias-variance trade-off</title>
  <desc id="d">As model complexity grows, squared bias falls, variance rises, and their sum traces a U-shaped test error curve with a minimum.</desc>
  <style>
    .b { stroke: #111; stroke-width: 1.5; fill: none; stroke-dasharray: 5,3; }
    .v { stroke: #111; stroke-width: 1.5; fill: none; stroke-dasharray: 2,3; }
    .t { stroke: #111; stroke-width: 2.2; fill: none; }
    .ax { stroke: #111; stroke-width: 1.2; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .pt { fill: #111; }
  </style>
  <text class="ttl" x="330" y="20" text-anchor="middle">Expected test error at a fixed input</text>
  <line class="ax" x1="50" y1="200" x2="600" y2="200"/>
  <line class="ax" x1="50" y1="30" x2="50" y2="200"/>
  <text class="lab" x="330" y="222" text-anchor="middle">model complexity →</text>
  <text class="lab" x="42" y="28" text-anchor="end">error</text>
  <path class="b" d="M70 50 C120 80, 200 130, 320 168 C440 190, 540 196, 590 198"/>
  <text class="lab" x="86" y="58">bias²</text>
  <path class="v" d="M70 185 C160 182, 260 176, 360 140 C460 100, 540 60, 590 45"/>
  <text class="lab" x="560" y="52">variance</text>
  <path class="t" d="M70 55 C150 95, 240 140, 330 148 C420 140, 520 105, 590 62"/>
  <text class="lab" x="470" y="92">bias² + variance (+ noise)</text>
  <circle class="pt" cx="330" cy="148" r="3.5"/>
  <line class="ax" x1="330" y1="148" x2="330" y2="200" stroke-dasharray="3,2"/>
  <text class="lab" x="330" y="192" text-anchor="middle" dx="58">best complexity</text>
</svg>
