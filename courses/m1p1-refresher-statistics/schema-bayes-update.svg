<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-labelledby="t d">
  <title id="t">Bayesian updating, Bernoulli-Beta</title>
  <desc id="d">Three panels: flat Beta(1,1) prior, likelihood peaked near 0.8 after 8 successes in 10 trials, posterior Beta(9,3) with mean 0.75.</desc>
  <style>
    .c { stroke: #111; stroke-width: 1.8; fill: none; }
    .ax { stroke: #111; stroke-width: 1.2; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
  </style>
  <text class="ttl" x="110" y="16" text-anchor="middle">Prior: π ~ Beta(1,1)</text>
  <path class="c" d="M40 110 H180"/>
  <line class="ax" x1="40" y1="160" x2="180" y2="160"/>
  <text class="lab" x="44" y="174">0</text>
  <text class="lab" x="176" y="174">1</text>
  <text class="lab" x="110" y="192" text-anchor="middle">uniform — a choice, not</text>
  <text class="lab" x="110" y="206" text-anchor="middle">"knowing nothing"</text>

  <text class="ttl" x="340" y="16" text-anchor="middle">Likelihood: L(p) ∝ p⁸(1−p)²</text>
  <path class="c" d="M270 158 C290 156, 296 60, 316 58 C336 60, 352 130, 405 157"/>
  <line class="ax" x1="270" y1="160" x2="410" y2="160"/>
  <text class="lab" x="274" y="174">0</text>
  <text class="lab" x="406" y="174">1</text>
  <text class="lab" x="316" y="48" text-anchor="middle">MLE 0.8</text>
  <text class="lab" x="340" y="192" text-anchor="middle">8 successes / 10 trials</text>

  <text class="ttl" x="570" y="16" text-anchor="middle">Posterior: p | x ~ Beta(9,3)</text>
  <path class="c" d="M500 158 C515 156, 520 66, 545 62 C570 66, 585 140, 635 157"/>
  <line class="ax" x1="500" y1="160" x2="640" y2="160"/>
  <text class="lab" x="504" y="174">0</text>
  <text class="lab" x="636" y="174">1</text>
  <line class="ax" x1="547" y1="62" x2="547" y2="160" stroke-dasharray="3,2"/>
  <text class="lab" x="547" y="52" text-anchor="middle">mean 0.75</text>
  <text class="lab" x="570" y="192" text-anchor="middle">prior counts + data counts</text>
  <text class="ttl" x="330" y="228" text-anchor="middle">posterior ∝ likelihood × prior — counts add: (1+8, 1+2)</text>
</svg>
