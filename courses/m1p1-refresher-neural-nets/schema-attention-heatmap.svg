<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="t d">
  <title id="t">Toy attention weights T×T</title>
  <desc id="d">4 by 4 attention weight matrix with darker cells for larger weights.</desc>
  <style>
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
  </style>
  <text class="ttl" x="160" y="22" text-anchor="middle">Attention weights (T=4)</text>
  <!-- row0 -->
  <rect x="60" y="40" width="48" height="48" fill="#111" opacity="0.15"/><rect x="112" y="40" width="48" height="48" fill="#111" opacity="0.75"/><rect x="164" y="40" width="48" height="48" fill="#111" opacity="0.25"/><rect x="216" y="40" width="48" height="48" fill="#111" opacity="0.20"/>
  <!-- row1 -->
  <rect x="60" y="92" width="48" height="48" fill="#111" opacity="0.20"/><rect x="112" y="92" width="48" height="48" fill="#111" opacity="0.30"/><rect x="164" y="92" width="48" height="48" fill="#111" opacity="0.70"/><rect x="216" y="92" width="48" height="48" fill="#111" opacity="0.25"/>
  <!-- row2 -->
  <rect x="60" y="144" width="48" height="48" fill="#111" opacity="0.55"/><rect x="112" y="144" width="48" height="48" fill="#111" opacity="0.20"/><rect x="164" y="144" width="48" height="48" fill="#111" opacity="0.20"/><rect x="216" y="144" width="48" height="48" fill="#111" opacity="0.45"/>
  <!-- row3 -->
  <rect x="60" y="196" width="48" height="48" fill="#111" opacity="0.18"/><rect x="112" y="196" width="48" height="48" fill="#111" opacity="0.22"/><rect x="164" y="196" width="48" height="48" fill="#111" opacity="0.28"/><rect x="216" y="196" width="48" height="48" fill="#111" opacity="0.72"/>
  <text class="lab" x="84" y="255" text-anchor="middle">k0</text>
  <text class="lab" x="136" y="255" text-anchor="middle">k1</text>
  <text class="lab" x="188" y="255" text-anchor="middle">k2</text>
  <text class="lab" x="240" y="255" text-anchor="middle">k3</text>
  <text class="lab" x="40" y="68" text-anchor="middle">q0</text>
  <text class="lab" x="40" y="120" text-anchor="middle">q1</text>
  <text class="lab" x="40" y="172" text-anchor="middle">q2</text>
  <text class="lab" x="40" y="224" text-anchor="middle">q3</text>
  <text class="lab" x="160" y="275" text-anchor="middle">darker = larger softmax weight</text>
</svg>
