<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t d">
  <title id="t">MNIST MLP pipeline</title>
  <desc id="d">28 by 28 digit flattened to 784, hidden layer H, 10 logits, softmax and argmax.</desc>
  <style>
    .box { fill: #fff; stroke: #111; stroke-width: 1.4; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; }
    .sub { fill: #555; font-family: system-ui, sans-serif; font-size: 10px; }
    .arr { stroke: #111; stroke-width: 1.6; fill: none; marker-end: url(#m); }
    .pix { fill: #111; opacity: .75; }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <!-- digit grid -->
  <rect class="box" x="20" y="50" width="70" height="70"/>
  <g transform="translate(28,58)">
    <rect class="pix" x="8" y="4" width="6" height="6"/><rect class="pix" x="14" y="4" width="6" height="6"/>
    <rect class="pix" x="20" y="10" width="6" height="6"/><rect class="pix" x="26" y="16" width="6" height="6"/>
    <rect class="pix" x="26" y="22" width="6" height="6"/><rect class="pix" x="26" y="28" width="6" height="6"/>
    <rect class="pix" x="26" y="34" width="6" height="6"/><rect class="pix" x="20" y="40" width="6" height="6"/>
    <rect class="pix" x="14" y="46" width="6" height="6"/><rect class="pix" x="8" y="46" width="6" height="6"/>
  </g>
  <text class="lab" x="55" y="140" text-anchor="middle">28×28</text>
  <text class="sub" x="55" y="156" text-anchor="middle">digit</text>
  <path class="arr" d="M95 85 H130"/>
  <text class="sub" x="112" y="78" text-anchor="middle">flatten</text>
  <!-- 784 -->
  <rect class="box" x="130" y="55" width="70" height="60" rx="4"/>
  <text class="lab" x="165" y="82" text-anchor="middle">784</text>
  <text class="sub" x="165" y="98" text-anchor="middle">(B,784)</text>
  <path class="arr" d="M205 85 H250"/>
  <text class="sub" x="227" y="78" text-anchor="middle">W¹,b¹</text>
  <!-- hidden -->
  <rect class="box" x="250" y="40" width="90" height="90" rx="4"/>
  <text class="lab" x="295" y="72" text-anchor="middle">hidden H</text>
  <text class="sub" x="295" y="90" text-anchor="middle">z¹ = XW¹+b¹</text>
  <text class="sub" x="295" y="106" text-anchor="middle">h = σ(z¹)</text>
  <text class="sub" x="295" y="120" text-anchor="middle">(B,H)</text>
  <path class="arr" d="M345 85 H390"/>
  <text class="sub" x="367" y="78" text-anchor="middle">W²,b²</text>
  <!-- logits -->
  <rect class="box" x="390" y="55" width="90" height="60" rx="4"/>
  <text class="lab" x="435" y="82" text-anchor="middle">10 logits</text>
  <text class="sub" x="435" y="98" text-anchor="middle">(B,10)</text>
  <path class="arr" d="M485 85 H530"/>
  <!-- softmax -->
  <rect class="box" x="530" y="40" width="100" height="90" rx="4"/>
  <text class="lab" x="580" y="72" text-anchor="middle">softmax</text>
  <text class="sub" x="580" y="90" text-anchor="middle">p̂ ∈ Δ⁹</text>
  <text class="sub" x="580" y="106" text-anchor="middle">argmax → ŷ</text>
  <text class="sub" x="580" y="122" text-anchor="middle">class 0…9</text>
</svg>
