<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" role="img" aria-labelledby="t d">
  <title id="t">Gradient regimes</title>
  <desc id="d">Three panels: healthy loss, exploding loss, vanishing gradients.</desc>
  <style>
    .box { fill: #fff; stroke: #111; stroke-width: 1.2; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .sub { fill: #555; font-family: system-ui, sans-serif; font-size: 10px; }
    .c { stroke: #111; stroke-width: 1.8; fill: none; }
  </style>
  <rect class="box" x="10" y="10" width="210" height="160" rx="4"/>
  <text class="lab" x="115" y="32" text-anchor="middle">Healthy descent</text>
  <path class="c" d="M30 50 C70 55, 90 90, 120 110 C150 130, 180 140, 200 145"/>
  <text class="sub" x="115" y="165" text-anchor="middle">loss ↓ smoothly vs epoch</text>
  <rect class="box" x="235" y="10" width="210" height="160" rx="4"/>
  <text class="lab" x="340" y="32" text-anchor="middle">Explosion (η too large)</text>
  <path class="c" d="M255 140 L280 120 L310 90 L340 40 L360 20 L380 50 L400 15"/>
  <text class="sub" x="340" y="165" text-anchor="middle">NaNs / wild jumps</text>
  <rect class="box" x="460" y="10" width="210" height="160" rx="4"/>
  <text class="lab" x="565" y="32" text-anchor="middle">Vanishing (sigmoid deep)</text>
  <path class="c" d="M480 60 C520 58, 560 55, 640 52"/>
  <text class="sub" x="565" y="100" text-anchor="middle">‖δ‖ → 0 toward input</text>
  <text class="sub" x="565" y="165" text-anchor="middle">flat loss plateau</text>
</svg>
