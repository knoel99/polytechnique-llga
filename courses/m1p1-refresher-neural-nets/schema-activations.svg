<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t d">
  <title id="t">Identity, sigmoid, ReLU</title>
  <desc id="d">Three activation curves on the same axes for qualitative comparison.</desc>
  <style>
    .ax { stroke: #111; stroke-width: 1.2; fill: none; }
    .g { stroke: #ccc; stroke-width: 0.8; }
    .id { stroke: #0645ad; stroke-width: 2; fill: none; }
    .sg { stroke: #a21caf; stroke-width: 2; fill: none; }
    .rl { stroke: #15803d; stroke-width: 2; fill: none; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .leg { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; }
  </style>
  <!-- axes -->
  <line class="g" x1="40" y1="110" x2="400" y2="110"/>
  <line class="g" x1="220" y1="20" x2="220" y2="200"/>
  <line class="ax" x1="40" y1="110" x2="400" y2="110"/>
  <line class="ax" x1="220" y1="20" x2="220" y2="200"/>
  <!-- identity: y=x from (-4,-4) to (4,4) mapped -->
  <line class="id" x1="100" y1="170" x2="340" y2="50"/>
  <!-- sigmoid: approximate path -->
  <path class="sg" d="M60 155 C120 152, 160 140, 220 110 C280 80, 320 68, 380 65"/>
  <!-- ReLU -->
  <path class="rl" d="M60 110 L220 110 L340 50"/>
  <text class="lab" x="405" y="118">z</text>
  <text class="lab" x="225" y="16">σ(z)</text>
  <!-- legend -->
  <line class="id" x1="460" y1="50" x2="500" y2="50"/><text class="leg" x="510" y="54">identity</text>
  <line class="sg" x1="460" y1="80" x2="500" y2="80"/><text class="leg" x="510" y="84">sigmoid</text>
  <line class="rl" x1="460" y1="110" x2="500" y2="110"/><text class="leg" x="510" y="114">ReLU</text>
  <text class="lab" x="460" y="150">sigmoid → (0,1), saturates</text>
  <text class="lab" x="460" y="168">ReLU → sparse, unbounded +</text>
  <text class="lab" x="460" y="186">identity → linear pass-through</text>
</svg>
