<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="t d">
  <title id="t">BFS vs DFS on a toy graph</title>
  <desc id="d">Small graph with BFS layers and DFS discovery order annotated.</desc>
  <style>
    .n { fill: #fff; stroke: #111; stroke-width: 1.5; }
    .e { stroke: #111; stroke-width: 1.3; fill: none; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; }
    .sub { fill: #555; font-family: system-ui, sans-serif; font-size: 10px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
  </style>
  <!-- graph -->
  <path class="e" d="M120 50 L60 120"/><path class="e" d="M120 50 L180 120"/>
  <path class="e" d="M60 120 L40 190"/><path class="e" d="M60 120 L100 190"/>
  <path class="e" d="M180 120 L160 190"/><path class="e" d="M180 120 L220 190"/>
  <circle class="n" cx="120" cy="50" r="18"/><text class="lab" x="120" y="54" text-anchor="middle">A</text>
  <circle class="n" cx="60" cy="120" r="18"/><text class="lab" x="60" y="124" text-anchor="middle">B</text>
  <circle class="n" cx="180" cy="120" r="18"/><text class="lab" x="180" y="124" text-anchor="middle">C</text>
  <circle class="n" cx="40" cy="190" r="16"/><text class="lab" x="40" y="194" text-anchor="middle">D</text>
  <circle class="n" cx="100" cy="190" r="16"/><text class="lab" x="100" y="194" text-anchor="middle">E</text>
  <circle class="n" cx="160" cy="190" r="16"/><text class="lab" x="160" y="194" text-anchor="middle">F</text>
  <circle class="n" cx="220" cy="190" r="16"/><text class="lab" x="220" y="194" text-anchor="middle">G</text>
  <text class="ttl" x="420" y="40">BFS from A (queue)</text>
  <text class="lab" x="420" y="62">order: A, B, C, D, E, F, G</text>
  <text class="sub" x="420" y="80">layers: {A} → {B,C} → {D,E,F,G}</text>
  <text class="ttl" x="420" y="120">DFS from A (stack / recursion)</text>
  <text class="lab" x="420" y="142">one possible order: A, B, D, E, C, F, G</text>
  <text class="sub" x="420" y="160">goes deep on B before touching C</text>
  <text class="sub" x="420" y="190">queue ⇒ breadth; stack ⇒ depth</text>
</svg>
