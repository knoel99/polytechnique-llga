<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="t d">
  <title id="t">Stack frames and pointers</title>
  <desc id="d">Call stack with frames and a heap object referenced by pointer.</desc>
  <style>
    .box { fill: #fff; stroke: #111; stroke-width: 1.3; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 11px; }
    .ttl { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .arr { stroke: #111; stroke-width: 1.4; fill: none; marker-end: url(#m); }
  </style>
  <defs><marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 Z" fill="#111"/></marker></defs>
  <text class="ttl" x="120" y="24" text-anchor="middle">Call stack</text>
  <rect class="box" x="40" y="40" width="160" height="40"/><text class="lab" x="120" y="64" text-anchor="middle">main()</text>
  <rect class="box" x="40" y="80" width="160" height="50"/><text class="lab" x="120" y="100" text-anchor="middle">f(x=3)</text>
  <text class="lab" x="120" y="118" text-anchor="middle">local p →</text>
  <rect class="box" x="40" y="130" width="160" height="50"/><text class="lab" x="120" y="150" text-anchor="middle">g()  ← top</text>
  <text class="lab" x="120" y="168" text-anchor="middle">return addr</text>
  <path class="arr" d="M200 110 H300"/>
  <text class="ttl" x="400" y="24" text-anchor="middle">Heap</text>
  <rect class="box" x="300" y="80" width="200" height="70" rx="4"/>
  <text class="lab" x="400" y="110" text-anchor="middle">list object [1,2,3]</text>
  <text class="lab" x="400" y="130" text-anchor="middle">id / refcount</text>
  <text class="lab" x="280" y="220">stack grows with calls; heap holds objects; p stores a reference</text>
</svg>
