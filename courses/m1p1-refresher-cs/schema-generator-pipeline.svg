<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" role="img" aria-labelledby="t d">
  <title id="t">Generator pipeline</title>
  <desc id="d">Lazy pipeline: source generator, filter, map, sink — one item at a time.</desc>
  <style>
    .box { fill: #fff; stroke: #111; stroke-width: 1.3; }
    .lab { fill: #111; font-family: system-ui, sans-serif; font-size: 12px; }
    .sub { fill: #555; font-family: system-ui, sans-serif; font-size: 10px; }
    .arr { stroke: #111; stroke-width: 1.5; fill: none; marker-end: url(#m); }
  </style>
  <defs><marker id="m" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 Z" fill="#111"/></marker></defs>
  <rect class="box" x="20" y="30" width="120" height="55" rx="4"/>
  <text class="lab" x="80" y="55" text-anchor="middle">gen source</text>
  <text class="sub" x="80" y="72" text-anchor="middle">yield lines</text>
  <path class="arr" d="M145 57 H185"/>
  <rect class="box" x="185" y="30" width="120" height="55" rx="4"/>
  <text class="lab" x="245" y="55" text-anchor="middle">filter</text>
  <text class="sub" x="245" y="72" text-anchor="middle">if pred: yield</text>
  <path class="arr" d="M310 57 H350"/>
  <rect class="box" x="350" y="30" width="120" height="55" rx="4"/>
  <text class="lab" x="410" y="55" text-anchor="middle">map</text>
  <text class="sub" x="410" y="72" text-anchor="middle">yield f(x)</text>
  <path class="arr" d="M475 57 H515"/>
  <rect class="box" x="515" y="30" width="160" height="55" rx="4"/>
  <text class="lab" x="595" y="55" text-anchor="middle">sink / for-loop</text>
  <text class="sub" x="595" y="72" text-anchor="middle">pull one-by-one</text>
  <text class="sub" x="350" y="110" text-anchor="middle">O(1) memory beyond the current item — no full list materialization</text>
</svg>
